<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container d-flex flex-column justify-content-center align-items-center bg-info-subtle ">
        <div class="p-5 text-center">
            <img src="https://getbootstrap.com/docs/5.3/assets/brand/bootstrap-logo-shadow@2x.png" width="200px">
            <div class="display-5 text-center">Please Sign In</div>
            <form class="d-flex flex-column justify-content-center align-items-center ">
                <input type="email" class="form-control w-100 mb-3 mt-3 " placeholder="Email Address"
                    id="exampleInputEmail1" aria-describedby="emailHelp">
                <input type="password" class="form-control w-100 mb-3" placeholder="Password"
                    id="exampleInputPassword1">
                <div class="d-flex justify-content-center align-items-center gap-1">
                    <input type="checkbox" class="form-check-input  " id="exampleCheck1">
                    <label class="form-check-label" for="exampleCheck1">Remember Me</label>
                </div>


        </div>

        <button type="submit"
            class="btn btn-primary d-flex flex-column justify-content-center align-items-center w-25">Sign In</button>
        </form>
        <div class="text-center m-4 text-muted">&copy; 2015-2017</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
