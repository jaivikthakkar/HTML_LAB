<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .left {
            height: 50vw;
            width: 50vw;
        }

        .right {
            width: 50vw;
            height: 50vw;
        }
    </style>
</head>

<body>
    <div class="container mt-5 ">
        <div class="main justify-content-center d-flex">
            <div class="left bg-primary text-white row align-items-center">
                <div class="col">
                    <div class="text-center align-self-center align-self-mid"><p class="fs-1">WELCOME BACK</p></div>
                </div>
            </div>
            <div class="right row align-items-center">
                <div class="col">
                    <div class="h3 text-center">Login Account</div>
                    <form class="d-flex flex-column justify-content-center  ">
                        <input type="email" class="form-control w-50 mb-3 mt-3  col align-self-center" placeholder="Email Address"
                            id="exampleInputEmail1" aria-describedby="emailHelp">
                        <input type="password" class="form-control w-50 mb-3  col align-self-center" placeholder="Password"
                            id="exampleInputPassword1">
                        <div class="d-flex align-items-center gap-1  col align-self-center">
                            <input type="checkbox" class="form-check-input " id="exampleCheck1">
                            <label class="form-check-label" for="exampleCheck1">kepp sined-in</label>
                            <div class="text-center align-middle"><a href="">Alareday mameber</a></div>
                        </div>
                        <button type="submit" class="btn btn-primary col align-self-center w-50 pt-2">Sign In</button>
                    </form>
                </div>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
