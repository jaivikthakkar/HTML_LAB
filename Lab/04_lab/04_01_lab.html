<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='main.css'>
</head>

<body>
    <form>
        <table align="center">
            <tr>
                <td align="center" colspan="2">
                    <h1>Student Registraction</h1>
                </td>
            </tr>
            <tr align="center">
                <td align="center">
                    <label for="fullname">FullName</label>
                </td>
                <td>
                    <input id="fullname" name="fullname" type="text" required placeholder="FULL NAME">
                </td>
            </tr>
            <tr align="center">
                <td>
                    <label for="email">Email</label>
                </td>
                <td>
                    <input id="email" name="email" type="email" required placeholder="EMAIL">
                </td>
            </tr>
            <tr align="center">
                <td>
                    <label for="mobilenumber">Mobile Number</label>
                </td>
                <td>
                    <input id="mobilenumber" name="phonenumber" type="tel" required placeholder="EX.9876589152">
                </td>
            </tr>
            <tr align="center">
                <td>
                    <label for="address">Address</label>
                </td>
                <td>
                    <textarea id="address" name="address" type="text"  placeholder="ADDRESS"></textarea>
                </td>
            </tr>
            <tr align="center">
                <td>
                    <label for="nationality">Nationality</label>
                </td>
                <td>
                    <input id="nationality" name="nationality" type="text"  placeholder="nationality">
                </td>
            </tr>
            <tr align="center">
                <td>
                    <label for="dob">Date of Birth</label>
                </td>
                <td>
                    <input id="dob" name="dob" type="date" required >
                </td>
            </tr>
            <tr align="center">
                <td>
                    <label for="gender">Gender</label>
                </td>
                <td>
                    <input name="gender" value="male" type="radio" required>
                    <label for="male">male</label>
                    <input name="gender" value="female" type="radio" required>
                    <label for="female">female</label>
                </td>
            </tr>
            <tr align="center">
                <td>
                    <label for="dgree">Hight Dgree</label>
                </td>
                <td>
                    <select id="fullname" name="fullname" type="text" required placeholder="FULL NAME">
                        <option value=""></option>
                        <option value="BCA">BCA</option>
                        <option value="MBA">MBA</option>
                        <option value="BBA">BBA</option>
                        <option value="B.tech">B.tech</option>
                        <option value="M.tech">M.tech</option>
                    </select>
                </td>
            </tr>
            </tr>
            <tr align="center">
                <td>
                    <label for="cpi">CPI</label>
                </td>
                <td>
                    <input id="cpi" name="cpi" type="number" required placeholder="">
                </td>
            </tr>
            </tr>
            <tr align="center">
                <td>
                    <label for="university">Univeersity</label>
                </td>
                <td>
                    <input id="university" name="univercity" type="text" required placeholder="">
                </td>
            </tr>

            <tr align="center">
                <td>
                    <label for="passingyear">Passing Year</label>
                </td>
                <td>
                    <select id="passingyear" name="passingyear" type="number" required >
                        <option value=""></option>
                        <option value="2001">2001</option>
                        <option value="2002">2002</option>
                        <option value="2003">2003</option>
                        <option value="2004">2004</option>
                        <option value="2005">2005</option>
                        <option value="2006">2006</option>
                        <option value="2007">2007</option>
                        <option value="2008">2008</option>
                        <option value="2009">2009</option>
                        <option value="2010">2010</option>
                        <option value="2011">2011</option>
                        <option value="2012">2012</option>
                        <option value="2013">2013</option>
                        <option value="2014">2014</option>
                        <option value="2015">2015</option>
                        <option value="2016">2016</option>
                        <option value="2017">2017</option>
                        <option value="2018">2018</option>
                        <option value="2019">2019</option>
                        <option value="2020">2020</option>
                        <option value="2021">2021</option>
                        <option value="2022">2022</option>
                        <option value="2023">2023</option>
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                    </select>
                </td>
            </tr>
            <tr align="center">
                <td>

                </td>
                <td>
                    <input type="submit" value="submit">
                    <input type="reset"  value="reset">
                </td>

            </tr>


    </form>
    </table>
</body>

</html>
