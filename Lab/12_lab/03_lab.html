<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <!-- <link rel='stylesheet' href='main.css'> -->
    <style>
        main{
            background-color: rgba(255, 0, 162, 0.183);
        }
        .row{
            display: flex;

        }

        .box{
            height: 100px;
            width: 200px;
            margin: 20px;
            border-radius: 10px;

        }
        #p1{
            background-image: linear-gradient(145deg ,green,blue,pink);

        }
        #p2{
            background-image: linear-gradient(30deg, brown,blue);

        }
        #p3{
            background-image: linear-gradient(145deg,orange,blue,violet);

        }
        #p4{
            background-image: linear-gradient(150deg,blue,red);

        }
        #p5{
            background-image: linear-gradient(45deg,blue,violet);

        }
        #p6{
            background-image: linear-gradient(45deg,orange,blue,violet);
        }
        #p7{
           background-image: linear-gradient(150deg,rgb(225, 0, 255),rgb(0, 98, 255),rgb(238, 130, 164));
        }

        #p8{
            background-image: linear-gradient(to right,rgb(255, 196, 0),rgb(234, 238, 130));
        }
        #p9{
            background-image: linear-gradient(to left,orange,blue,violet);
        }
        #p10{
            background-image: linear-gradient(145deg,rgb(229, 255, 0),rgb(130, 238, 207));
        }
        #p11{
            background-image: linear-gradient(to right,rgb(133, 142, 38),rgb(236, 130, 238),rgb(121, 161, 210));
        }
        #p12{
            background-image: linear-gradient(to bottom,rgb(38, 142, 52),rgb(238, 198, 130),rgb(210, 121, 182));
        }
        #p13{
            background-image: linear-gradient(30deg, rgb(182, 132, 232),rgb(47, 255, 0));
        }
        #p14{
            background-image: linear-gradient(30deg, rgb(232, 194, 132),rgb(174, 0, 255),rgb(7, 2, 41));
        }
        #p15{
            background-image: linear-gradient(30deg, rgb(132, 232, 170),rgb(0, 110, 255));
        }




    </style>
</head>

<body>
    <main>
        <div class="row">
            <div class="box" id="p1"></div>
            <div class="box" id="p2"></div>
            <div class="box" id="p3"></div>
        </div>
        <div class="row">
            <div class="box" id="p4"></div>
            <div class="box" id="p5"></div>
            <div class="box" id="p6"></div>
        </div>
        <div class="row">
            <div class="box" id="p7"></div>
            <div class="box" id="p8"></div>
            <div class="box" id="p9"></div>
        </div>
        <div class="row">
            <div class="box" id="p10"></div>
            <div class="box" id="p11"></div>
            <div class="box" id="p12"></div>
        </div>
        <div class="row">
            <div class="box" id="p13"></div>
            <div class="box" id="p14"></div>
            <div class="box" id="p15"></div>
        </div>
    </main>
</body>

</html>
