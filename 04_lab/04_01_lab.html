<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='main.css'>
</head>

<body>
    <table align="center">
        <form>
            <h1 align="center">Student Registratin</h1>

            <tr>
            <tr>
                <td align="center">
                    <label for="fullname">FullName</label>
                </td>
                <td>
                    <input type="text" id="fullname" name="fullname" required>
                </td>
            </tr>

            <tr>
                <td align="center">
                    <label for="email">Email</label>
                </td>
                <td>
                    <input type="email" id="email" name="email" required>
                </td>
            </tr>

            <tr>
                <td align="center">

                    <label for="number">Mobile No</label>
                </td>
                <td>
                    <input type="tel" id="number" name="nymber" required>
                </td>
            </tr>
            <tr>

                <td align="center">
                    <label for="addres">Address</label>
                    </td>
                    <td>
                    <input type="address" id="address" name="address" required>
                </td>
            </tr>

            <tr>
                <td align="center">
                    <label for="nationality">Nationality</label>
                    </td>
                    <td>
                    <input type="text" id="nationality" name="nationality" required>
                </td>
            </tr>

            <tr>
                <td align="center">

                    <label for="dob">Date Of Birth</label>
                </td>
                <td>
                    <input type="date" id="dob" name="dob" required>
                </td>
            </tr>
            <tr>

                <td align="center">
                    <label for="gender">gender</label>
                    </td>
                    <td>
                    <input type="radio" id="gender" name="gender" value="male">
                    <label for="gender">Male</label>
                    <input type="radio" id="gender" name="gender" value="female">
                    <label for="gender">Female</label>

                </td>
            </tr>

            <tr>

                <td align="center">
                    <label for="highestdegree">Highest Degree</label>
                    </td>
                    <td>
                    <select name="highestdegree" id="highestdegree">

                        <option>BCA</option>
                        <option>BBA</option>
                        <option>B.com</option>
                        <option>B.tech</option>
                        <option>MBA</option>

                    </select>


            </tr>
            <tr>
                <td align="center">
                    <label for="cpi">CPI</label>
                    </td>
                    <td>
                    <input type="number" id="cpi" name="cpi" required>
                </td>
            </tr>
            <tr>

                <td align="center">
                    <label for="university">University</label>
                    </td>
                    <td>
                    <input type="text" id="university" name="university" required>
                </td>
            </tr>
            <tr>

                <td align="center">
                    <label for="passingyear">Passing Year</label>
                    </td>
                    <td>
                    <select name="passingyear" id="passingyear">
                        <option>2001</option>
                        <option>2002</option>
                        <option>2003</option>
                        <option>2004</option>
                        <option>2005</option>
                        <option>2006</option>
                        <option>2007</option>
                        <option>2008</option>

                    </select>
            </tr>
            <tr>
                <td></td>
                    <input type="submit" name="submit">
                </td>
                <td>
                    <input type="reset" name="cancle">
                </td>
            </tr>

            </tr>
        </form>
    </table>
</body>

</html>
