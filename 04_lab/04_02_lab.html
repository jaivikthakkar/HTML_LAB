<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <form>
        <table align="center">
            <tr><h1 align="center">COVID-19 Vaccine Registration Form</h1></tr>
            <tr>
                <td>
                    <label for="firstname">First Name</label>
                </td>
                <td>
                    <input  type="text" name="firstname" id="firstname" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="lastname">Last Name</label>
                </td>
                <td>
                    <input type="text" name="lastname" id="lastname" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="aadharnumber">Aadhar Number</label>
                </td>
                <td>
                    <input type="number" name="aadharnumber" id="aadharnumber" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="vaccinename">Vaccine Name</label>
                </td>
                <td>
                    <select type="textbox" name="firstname" id="firstname" required>

                        <option value="v1">v1</option>
                        <option value="v2">v2</option>
                        <option value="v3">v3</option>
                        <option value="v4">v5</option>

                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="vaccinationcentername">Vaccination Center Name</label>
                </td>
                <td>
                    <select type="textbox" name="firstname" id="firstname" required>

                        <option value="v_1">v_1</option>
                        <option value="v_2">v_2</option>
                        <option value="v_3">v_3</option>
                        <option value="v_4">v_5</option>

                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="dod">Date of Dose</label>
                </td>
                <td>
                    <input type="date" name="dod" id="dod" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="dn">Dose Number</label>
                </td>
                <td>
                    <input type="number" name="dn" id="dn" required>
                </td>
            </tr>
            <tr>
                <td>
                    
                </td>
                <td>
                    <input type="submit" value="CLIC HERE ">
                    <input type="reset" value="CANCEL">
                </td>
            </tr>


        </table>
    </form>
</body>
</html>
