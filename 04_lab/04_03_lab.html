<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='main.css'>
</head>

<body>
    <table align="center" cellpadding="3" cellspacing="7">
        <form>

            <tr align="center">
                <td colspan="6">
                    <h1>Employee Registration</h1>
                </td>
            </tr>
            <tr align="center">
                <td colspan="6">
                    <h3>Personal Information</h3>
                </td>
            </tr>
            <tr align="center">
                <td>
                    <label for="employeeid">Employee ID </label>
                </td>
                <td align="center">
                    :
                </td>
                <td align="center">
                    <input type="text" name="employeeid" id="employeeid" placeholder="Enter Employee Id">
                </td>
                <td>
                    <label for="employeename">Emplouee Name</label>
                </td>
                <td>
                    :
                </td>
                <td>
                    <input type="text" name="employeename" id="employeename" placeholder="Ebter Enployee Name">
                </td>
            </tr>
            <tr align="center">
                <td>
                    <label for="email">Email</label>
                </td>
                <td>
                    :
                </td>
                <td>
                    <input id="email" name="email" type="email" placeholder="Enter Email">
                </td>
                <td>
                    <label for="contact">Contact No</label>
                </td>
                <td>
                    :
                </td>
                <td>
                    <input id="contact" name="contact" type="number" placeholder="Enter Contact No">
                </td>
            </tr>
            <tr align="center">
                <td>
                    <label for="maritalstatus">Marital Status</label>

                </td>
                <td>:</td>
                <td>
                    <input type="radio" name="stus" id="stus" value="single">
                    Single
                    <input type="radio" name="stus" id="stus" value="single">
                    Married
                </td>
            </tr>
            <tr align="center">
                <td colspan="6">
                    <h3>Education Qualification</h3>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="education">Education</label>
                </td>
                <td>
                    :
                </td>
                <td>
                    <input id="education" name="education" type="text" required placeholder="Enter Education details">
                </td>
                <td>
                    <label for="experience">Experience</label>
                </td>
                <td>
                    :
                </td>
                <td>
                    <input id="experience" name="experience" type="text" required
                        placeholder="Enter Experience Details">
                </td>
            </tr>
            <tr align="center">
                <td colspan="6">
                    <h3>Job Details</h3>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="designation">Designation</label>
                </td>
                <td>
                    :
                </td>
                <td>
                    <input id="designation" name="designation" type="text" required
                        placeholder="Enter Designation details">
                </td>
                <td>
                    <label for="jobloction">Job loction</label>
                </td>
                <td>
                    :
                </td>
                <td>
                    <input id="jobloction" name="jobloction" type="text" required placeholder="Enter Job Location">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="salary">Salary </label>
                </td>
                <td>
                    :
                </td>
                <td>
                    <input id="salary" name="salary" type="number" required placeholder="Enter Salary details">
                </td>

            </tr>
            <tr>
                <td colspan="6">
                    <hr>
                </td>
            </tr>
            <tr>
                <td align="center" colspan="6">
                    <input type="submit" value="Register">
                </td>
            </tr>


        </form>
    </table>
</body>

</html>
